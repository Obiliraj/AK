<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1A252C" />
  <title>Kids Game Zone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/portal.css" />
  <style>
    header {
      text-align: center;
      padding: 48px 0 24px;
    }
    .logo {
      font-size: clamp(3rem, 10vw, 5rem);
      line-height: 1;
      display: inline-block;
      animation: bob 3s ease-in-out infinite;
    }
    h1 {
      margin: 12px 0 8px;
      font-size: clamp(2.2rem, 7vw, 3.6rem);
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    h1 span:nth-child(1) { color: var(--coral); }
    h1 span:nth-child(2) { color: var(--yellow); }
    h1 span:nth-child(3) { color: var(--teal); }
    .tagline {
      margin: 0;
      font-size: clamp(1.1rem, 3.5vw, 1.4rem);
      color: var(--ink-soft);
    }
    .section-title {
      font-size: 1.5rem;
      margin: 32px 0 16px;
    }
    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      padding-bottom: 48px;
    }
    .game-card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 2px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      transition: transform 0.15s ease;
    }
    .game-card:hover { transform: translateY(-4px) rotate(-0.5deg); }
    .game-card:active { transform: scale(0.98); }
    .game-art {
      height: 150px;
      display: grid;
      place-items: center;
      font-size: 5rem;
      background: var(--game-color);
      background-image: radial-gradient(circle at 20% 30%, rgba(26,37,44,.18) 0 30px, transparent 31px),
                        radial-gradient(circle at 80% 70%, rgba(26,37,44,.14) 0 45px, transparent 46px);
    }
    .game-body { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .game-body h3 { margin: 0; font-size: 1.5rem; }
    .game-body p { margin: 0; color: var(--ink-soft); font-size: 1.05rem; }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag {
      font-size: 0.9rem;
      background: var(--surface-2);
      color: var(--ink);
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 500;
    }
    .play {
      margin-top: auto;
      align-self: flex-start;
      background: var(--game-color);
    }
    .coming-soon {
      display: grid;
      place-items: center;
      text-align: center;
      min-height: 280px;
      border: 4px dashed var(--line);
      border-radius: var(--radius);
      color: var(--ink-soft);
      font-size: 1.15rem;
      padding: 24px;
    }
    .coming-soon div { font-size: 3rem; }
    footer { text-align: center; color: var(--ink-soft); padding: 0 0 32px; font-size: 0.95rem; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg);} 50% { transform: translateY(-10px) rotate(4deg);} }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo" aria-hidden="true">🎈</div>
      <h1><span>Kids</span> <span>Game</span> <span>Zone</span></h1>
      <p class="tagline">Fun games to play together with family and friends!</p>
    </header>

    <main>
      <h2 class="section-title">🎮 Pick a game</h2>
      <div class="games" id="games"></div>
    </main>

    <footer>Made with 💛 for curious kids</footer>
  </div>

  <script src="games.js"></script>
  <script>
    (function () {
      const grid = document.getElementById("games");
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const games = window.PORTAL_GAMES || [];
      grid.innerHTML = games.map((g) => `
        <a class="game-card" href="${esc(g.url)}" style="--game-color:${esc(g.color || "#00A8B5")}">
          <div class="game-art" aria-hidden="true">${esc(g.emoji || "🎲")}</div>
          <div class="game-body">
            <h3>${esc(g.title)}</h3>
            <p>${esc(g.description)}</p>
            <div class="tags">
              ${g.players ? `<span class="tag">👫 ${esc(g.players)}</span>` : ""}
              ${g.age ? `<span class="tag">⭐ ${esc(g.age)}</span>` : ""}
            </div>
            <span class="btn play">▶ Play</span>
          </div>
        </a>`).join("") + `
        <div class="coming-soon"><div>🧩</div><p>More games<br>coming soon!</p></div>`;
    })();
  </script>
</body>
</html>
